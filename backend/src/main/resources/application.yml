server:
  port: 8080

spring:
  application:
    name: academic-rag-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/academic_rag}
    username: ${SPRING_DATASOURCE_USERNAME:rag_user}
    password: ${SPRING_DATASOURCE_PASSWORD:rag_secret_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

gemini:
  api-key: ${GEMINI_API_KEY:dummy-key}
